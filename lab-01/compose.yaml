services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgresql://catshop:${POSTGRES_PASSWORD}@db:5432/catshop"

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U catshop -d catshop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_USER: catshop
      POSTGRES_DB: catshop
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: